name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_gate:
    name: Windows Gate (Windows 11 / Node.js 22)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install maintenance dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Windows Dev Check
        shell: pwsh
        run: tools/dev_check.ps1

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - name: Build Standalone Windows Executable
        shell: pwsh
        run: tools/build_exe.ps1

      - name: Upload Windows Standalone Executable Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-reset-checker-windows-x64
          path: |
            dist/codex-reset-checker.exe
            assets/icon.ico
            assets/icon.png
            scripts/codex-reset-tray.ps1
            scripts/launch-tray.vbs
            scripts/install.ps1
            codex-reset-tray.bat

  test:
    name: Node.js ${{ matrix.node-version }} (ubuntu)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 14
          - 18
          - 20
          - 22
          - 24

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Verify package contents
        run: npm pack --dry-run

  release_check:
    name: Check package version change
    # 硬閘門：只在上游官方 repo 執行 release 檢查
    if: github.repository == 'doggy8088/codex-reset-checker' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version.outputs.changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Compare package versions
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          PREVIOUS_VERSION=""

          if [ -n "$BEFORE_SHA" ] && git cat-file -e "$BEFORE_SHA:package.json" 2>/dev/null; then
            PREVIOUS_VERSION="$(
              git show "$BEFORE_SHA:package.json" |
                node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version'
            )"
          fi

          IS_PUBLISHED="false"
          if npm view "$PACKAGE_NAME@$CURRENT_VERSION" version >/dev/null 2>&1; then
            IS_PUBLISHED="true"
          fi

          if [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ] || [ "$IS_PUBLISHED" != "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Previous package version: ${PREVIOUS_VERSION:-not found}"
          echo "Current package version: $CURRENT_VERSION"
          echo "Is published on npm: $IS_PUBLISHED"

  release:
    name: Publish npm package and GitHub Release
    if: github.repository == 'doggy8088/codex-reset-checker' && needs.release_check.outputs.should_release == 'true'
    needs:
      - test
      - release_check
    runs-on: ubuntu-latest
    concurrency:
      group: npm-release
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        run: |
          npm install --global npm@latest
          npm --version

      - name: Prepare release metadata and notes
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          RELEASE_TAG="v$PACKAGE_VERSION"

          echo "package_name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            TAG_COMMIT="$(git rev-list -n 1 "$RELEASE_TAG")"
            if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
              echo "Tag $RELEASE_TAG already points to $TAG_COMMIT instead of $GITHUB_SHA." >&2
              echo "Bump package.json before pushing another commit to main." >&2
              exit 1
            fi
          fi

          RELEASE_STATE="missing"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" = "true" ]; then
              RELEASE_STATE="draft"
            else
              RELEASE_STATE="published"
            fi
          fi
          echo "release_state=$RELEASE_STATE" >> "$GITHUB_OUTPUT"

          PREVIOUS_TAG="$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          if [ -n "$PREVIOUS_TAG" ]; then
            COMMIT_RANGE="$PREVIOUS_TAG..$GITHUB_SHA"
          else
            COMMIT_RANGE="$GITHUB_SHA"
          fi

          {
            echo "## 變更摘要"
            echo
            git log "$COMMIT_RANGE" --first-parent --pretty=format:'- %s (`%h`)'
            echo
            echo
            echo "## 發佈資訊"
            echo
            echo "- npm 套件：\`$PACKAGE_NAME\`"
            echo "- 版本：\`$PACKAGE_VERSION\`"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "- Git 範圍：\`$PREVIOUS_TAG..$RELEASE_TAG\`"
            else
              echo "- Git 範圍：專案起點至 \`$RELEASE_TAG\`"
            fi
          } > release-notes.md

      - name: Create draft GitHub Release
        if: steps.release.outputs.release_state == 'missing'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TAG" \
            --notes-file release-notes.md \
            --draft

      - name: Install dependencies
        if: steps.release.outputs.release_state != 'published'
        run: npm ci

      - name: Run tests
        if: steps.release.outputs.release_state != 'published'
        run: npm test

      - name: Check npm package version
        if: steps.release.outputs.release_state != 'published'
        id: npm
        env:
          PACKAGE_NAME: ${{ steps.release.outputs.package_name }}
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        run: |
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package to npm
        if: steps.release.outputs.release_state != 'published' && steps.npm.outputs.published != 'true'
        run: npm publish --provenance --access public

      - name: Publish GitHub Release
        if: steps.release.outputs.release_state != 'published'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
